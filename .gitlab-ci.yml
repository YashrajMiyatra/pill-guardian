# GitLab CI/CD Pipeline for PillGuardian Mobile App
image: node:20-alpine

stages:
  - test
  - build

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
    - node_modules/

before_script:
  - npm ci --cache .npm --prefer-offline

# 1. Typecheck and Validation
typecheck:
  stage: test
  script:
    - npx tsc --noEmit
  rules:
    - if: $CI_COMMIT_BRANCH

# 2. Build Web Bundle Preview
build_bundle:
  stage: build
  script:
    - npx expo config
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"

# 3. Optional: Trigger EAS Cloud Build for App Store / Play Store via GitLab CI
# Requires EXPO_TOKEN configured in GitLab Settings -> CI/CD -> Variables
eas_build_check:
  stage: build
  rules:
    - if: $EXPO_TOKEN
  script:
    - npm install -g eas-cli
    - eas build:version
